<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManageLinks - Automated Test Runner</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css" />
  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .test-pass { color: #10b981; }
    .test-fail { color: #ef4444; font-weight: bold; }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 800px;">
    <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
      <div>
        <h3 class="fw-bold mb-0">ManageLinks Test Suite</h3>
        <span class="text-secondary small">Automated Quality Assurance & Verification &bull; Devraj Chauhan</span>
      </div>
      <div>
        <button id="btn-rerun" class="btn btn-primary btn-sm">Run All Tests</button>
      </div>
    </div>

    <!-- Summary Box -->
    <div class="card shadow-sm mb-4">
      <div class="card-body d-flex justify-content-around text-center py-3">
        <div>
          <div class="fs-4 fw-bold text-primary" id="total-tests">0</div>
          <div class="text-muted small">Total Checks</div>
        </div>
        <div>
          <div class="fs-4 fw-bold text-success" id="passed-tests">0</div>
          <div class="text-muted small">Passed</div>
        </div>
        <div>
          <div class="fs-4 fw-bold text-danger" id="failed-tests">0</div>
          <div class="text-muted small">Failed</div>
        </div>
      </div>
    </div>

    <!-- Log Console -->
    <div class="card shadow-sm">
      <div class="card-header bg-transparent py-2 fw-semibold">Execution Log</div>
      <div class="card-body p-0">
        <div id="test-log" class="list-group list-group-flush" style="font-family: monospace; font-size: 0.85rem;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { runValidationTests } from './validation-tests.js';
    import { runDatabaseTests } from './database-tests.js';
    import { runLinkTests } from './link-tests.js';
    import { runBackupTests } from './backup-tests.js';
    import { runImportExportTests } from './import-export-tests.js';

    let total = 0;
    let passed = 0;
    let failed = 0;

    const logContainer = document.getElementById('test-log');

    function assert(condition, message) {
      total++;
      const item = document.createElement('div');
      item.className = 'list-group-item py-2 px-3 d-flex justify-content-between align-items-center';

      if (condition) {
        passed++;
        item.innerHTML = `<span><strong class="text-success">&check; PASS:</strong> ${message}</span> <span class="badge bg-success-subtle text-success">OK</span>`;
      } else {
        failed++;
        item.innerHTML = `<span><strong class="text-danger">&cross; FAIL:</strong> ${message}</span> <span class="badge bg-danger-subtle text-danger">ERROR</span>`;
      }

      logContainer.appendChild(item);
      updateSummary();
    }

    function updateSummary() {
      document.getElementById('total-tests').textContent = total;
      document.getElementById('passed-tests').textContent = passed;
      document.getElementById('failed-tests').textContent = failed;
    }

    async function runSuite() {
      total = 0;
      passed = 0;
      failed = 0;
      logContainer.innerHTML = '';
      updateSummary();

      try {
        await runValidationTests(assert);
        await runDatabaseTests(assert);
        await runLinkTests(assert);
        await runBackupTests(assert);
        await runImportExportTests(assert);
      } catch (err) {
        assert(false, `Unexpected Suite Failure: ${err.message}`);
        console.error(err);
      }
    }

    document.getElementById('btn-rerun').addEventListener('click', runSuite);
    runSuite();
  </script>
</body>
</html>
